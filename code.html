    function exportAppointments(){
      const t=i18nTranslations[currentLang];
      const cell=value=>{const text=String(value);const safe=/^\s*[=+@-]/.test(text)?"'"+text:text;return '"'+safe.replace(/"/g,'""')+'"'};
      const rows=[[t.col_patient,t.field_phone,t.col_treatment,t.col_doctor,t.field_date,t.field_time,t.col_status],...getFilteredAppointments().map(item=>[item.patient[currentLang]||item.patient.en,item.phone,t.treatments[item.treatment],t.doctors[item.doctor],item.date,item.time,t[item.status]])];
      const csv=rows.map(row=>row.map(cell).join(',')).join('\r\n');
      const url=URL.createObjectURL(new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'}));
      const link=document.createElement('a');link.href=url;link.download='auraclinic-appointments.csv';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);

    function initDashboard(){document.getElementById('searchInput').addEventListener('input',filterAppointments);document.getElementById('appointmentForm').addEventListener('submit',submitAppointment);document.addEventListener('click',event=>{if(event.target.closest('[data-modal-close]'))closeModal();if(event.target.closest('[data-notes-close]'))closeNotesModal()});document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeModal();closeNotesModal()}});renderCalendar();applyTranslations()}
    function renderCalendar(){const days=currentLang==='ar'?['أح','إث','ثل','أر','خم','جم','سب']:['Su','Mo','Tu','We','Th','Fr','Sa'];document.getElementById('calendarGrid').innerHTML=days.map(day=>`<span class="font-semibold">${day}</span>`).join('')+[...Array(31)].map((_,index)=>`<span class="grid h-7 place-items-center rounded-full ${index===23?'bg-coral text-white':''}">${new Intl.NumberFormat(currentLang==='ar'?'ar-EG':'en-US').format(index+1)}</span>`).join('')}
    function applyTranslations(){const t=i18nTranslations[currentLang];document.documentElement.lang=currentLang;document.documentElement.dir=currentLang==='ar'?'rtl':'ltr';document.getElementById('langToggle').textContent=currentLang==='en'?'العربية':'EN';document.querySelectorAll('[data-i18n]').forEach(element=>{const key=element.dataset.i18n;if(t[key])element.textContent=t[key]});document.querySelectorAll('[data-i18n-placeholder]').forEach(element=>{const key=element.dataset.i18nPlaceholder;if(t[key])element.placeholder=t[key]});document.querySelectorAll('[name="treatment"] option').forEach(option=>option.textContent=t.treatments[option.value]);document.querySelectorAll('[name="doctor"] option').forEach(option=>option.textContent=t.doctors[option.value]);renderCalendar();renderStats();renderFilters();renderSuites();renderAppointments()}
    function renderStats(){const t=i18nTranslations[currentLang];const stats=[{label:t.total,value:appointmentsData.length,sub:t.bookings,icon:'▦'},{label:t.checkins,value:appointmentsData.filter(a=>a.status==='confirmed').length,sub:t.patients,icon:'✺'},{label:t.awaiting,value:appointmentsData.filter(a=>a.status==='pending').length,sub:t.review,icon:'◴'},{label:t.revenue,value:'$3,420',sub:'USD',icon:'▣'}];document.getElementById('statsGrid').innerHTML=stats.map((stat,index)=>`<article class="rounded-xl border border-stone bg-white p-5 shadow-soft"><div class="flex items-start justify-between"><p class="text-[10px] font-semibold uppercase tracking-wider text-slate-500">${stat.label}</p><span class="grid h-10 w-10 place-items-center rounded-lg ${index===3?'bg-[#FAD8D0] text-coral':'bg-sage text-forest'}">${stat.icon}</span></div><div class="mt-4 flex items-end gap-2"><strong class="text-3xl font-semibold ${index===3?'text-[#A53D28]':''}">${stat.value}</strong><span class="pb-1 text-xs">${stat.sub}</span></div></article>`).join('')}
    function renderFilters(){const t=i18nTranslations[currentLang];const filters=['all','confirmed','inProgress','completed'];document.getElementById('filterTabs').innerHTML=filters.map(filter=>{const count=filter==='all'?appointmentsData.length:appointmentsData.filter(item=>item.status===filter).length;return `<button onclick="setFilter('${filter}')" class="whitespace-nowrap border-b-2 px-4 py-3 text-xs font-medium ${activeFilter===filter?'border-coral text-forest':'border-transparent text-slate-500 hover:text-forest'}">${t[filter]} <span class="ms-1 rounded-full bg-canvas px-1.5 py-0.5 text-[10px]">${count}</span></button>`}).join('')}
    function renderSuites(){const t=i18nTranslations[currentLang];const suites=[[t.suite1,t.occupied,'bg-[#F9EAE6] text-[#9A3323]'],[t.suite2,t.ready,'bg-sage text-forest'],[t.suite3,t.occupied,'bg-[#F9EAE6] text-[#9A3323]']];document.getElementById('suiteList').innerHTML=suites.map(([name,status,style])=>`<div class="flex items-center justify-between rounded-lg bg-canvas p-3"><span class="text-xs font-medium">${name}</span><span class="status-dot rounded-full px-2 py-1 text-[10px] ${style}">${status}</span></div>`).join('')}
    function getFilteredAppointments(){const query=document.getElementById('searchInput').value.trim().toLocaleLowerCase(currentLang);const t=i18nTranslations[currentLang];return appointmentsData.filter(item=>{const matchesStatus=activeFilter==='all'||item.status===activeFilter;const patient=item.patient[currentLang]||item.patient.en;const treatment=t.treatments[item.treatment];return matchesStatus&&(!query||patient.toLocaleLowerCase(currentLang).includes(query)||treatment.toLocaleLowerCase(currentLang).includes(query))})}
    function renderAppointments(){const body=document.getElementById('appointmentsBody');const mobile=document.getElementById('mobileAppointments');if(!body||!mobile)return;const empty=document.getElementById('emptyState');const t=i18nTranslations[currentLang];const rows=getFilteredAppointments();document.getElementById('appointmentCount').textContent=`${appointmentsData.length} ${t.today}`;empty.classList.toggle('hidden',rows.length>0);body.classList.toggle('hidden',rows.length===0);mobile.classList.toggle('hidden',rows.length===0);body.innerHTML=rows.map(item=>{const patient=item.patient[currentLang]||item.patient.en;return `<tr class="transition hover:bg-canvas/60 ${item.status==='inProgress'?'bg-[#FFF7F5]':''}"><td class="px-5 py-4"><div class="flex items-center gap-3"><span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-canvas text-[10px] font-semibold">${initials(patient)}</span><div><strong class="block text-sm">${escapeHtml(patient)}</strong><span class="text-[10px] text-slate-500" dir="ltr">${escapeHtml(item.phone)}</span></div></div></td><td class="px-4 py-4 text-xs font-medium">${t.treatments[item.treatment]}</td><td class="px-4 py-4 text-xs">${t.doctors[item.doctor]}</td><td class="px-4 py-4"><strong class="block text-xs" dir="ltr">${formatTime(item.time)}</strong><span class="text-[10px] text-slate-500" dir="ltr">${item.date}</span></td><td class="px-4 py-4"><span class="status-dot inline-flex items-center rounded-full px-2.5 py-1 text-[10px] font-medium ${statusStyles[item.status]}">${t[item.status]}</span></td></tr>`}).join('');mobile.innerHTML=rows.map(item=>{const patient=item.patient[currentLang]||item.patient.en;return `<article class="p-4 ${item.status==='inProgress'?'bg-[#FFF7F5]':''}"><div class="flex items-start justify-between gap-3"><div class="flex min-w-0 items-center gap-3"><span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-canvas text-xs font-semibold">${initials(patient)}</span><div class="min-w-0"><strong class="block truncate text-sm">${escapeHtml(patient)}</strong><span class="text-[10px] text-slate-500" dir="ltr">${escapeHtml(item.phone)}</span></div></div><span class="status-dot shrink-0 rounded-full px-2 py-1 text-[9px] font-medium ${statusStyles[item.status]}">${t[item.status]}</span></div><div class="mt-4 grid grid-cols-2 gap-3 rounded-lg bg-canvas/70 p-3"><div><span class="block text-[9px] uppercase text-slate-400">${t.col_treatment}</span><strong class="mt-1 block text-xs">${t.treatments[item.treatment]}</strong></div><div><span class="block text-[9px] uppercase text-slate-400">${t.col_doctor}</span><strong class="mt-1 block text-xs">${t.doctors[item.doctor]}</strong></div><div class="col-span-2"><span class="block text-[9px] uppercase text-slate-400">${t.col_time}</span><strong class="mt-1 block text-xs" dir="ltr">${formatTime(item.time)} · ${item.date}</strong></div></div></article>`}).join('')}
    function formatTime(time){const [hour,minute]=time.split(':').map(Number);return new Intl.DateTimeFormat(currentLang==='ar'?'ar-EG':'en-US',{hour:'numeric',minute:'2-digit'}).format(new Date(2026,9,24,hour,minute))}
    function filterAppointments(){renderAppointments()}function setFilter(filter){activeFilter=filter;renderFilters();renderAppointments()}function toggleLang(){currentLang=currentLang==='en'?'ar':'en';applyTranslations()}function toggleSidebar(open){const sidebar=document.getElementById('sidebar');sidebar.classList.toggle('open',open);sidebar.style.transform=open?'translateX(0)':'';document.getElementById('sidebarBackdrop').classList.toggle('hidden',!open)}
    function activateSidebarNav(event,key){event.preventDefault();document.querySelectorAll('[data-sidebar-nav]').forEach(link=>{link.classList.remove('bg-white/10','text-white');link.classList.add('text-white/60')});event.currentTarget.classList.add('bg-white/10','text-white');event.currentTarget.classList.remove('text-white/60');document.getElementById('appointments').scrollIntoView({behavior:'smooth',block:'start'});toggleSidebar(false);showToast(i18nTranslations[currentLang][key])}
    function openModal(){const modal=document.getElementById('appointmentModal');modal.setAttribute('aria-hidden','false');document.body.classList.add('overflow-hidden');const input=document.querySelector('[name="date"]');input.min=new Date().toISOString().split('T')[0];if(!input.value)input.value=input.min;setTimeout(()=>document.querySelector('[name="patient"]').focus(),80)}
    function closeModal(){document.getElementById('appointmentModal').setAttribute('aria-hidden','true');document.body.classList.remove('overflow-hidden')}
    function submitAppointment(event){event.preventDefault();const form=new FormData(event.currentTarget);const patient=String(form.get('patient')).trim();appointmentsData.unshift({id:Date.now(),patient:{en:patient,ar:patient},phone:String(form.get('phone')),treatment:String(form.get('treatment')),doctor:String(form.get('doctor')),date:String(form.get('date')),time:String(form.get('time')),status:'confirmed'});activeFilter='all';event.currentTarget.reset();closeModal();renderStats();renderFilters();renderAppointments();showToast()}
    function showToast(message){const toast=document.getElementById('toast');document.getElementById('toastText').textContent=message||i18nTranslations[currentLang].toast;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),3200)}
    document.addEventListener('DOMContentLoaded',initDashboard);
  </script>
</body></html>
